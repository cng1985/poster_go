app:
  name: poster
  data_dir: ./data
server:
  host: 127.0.0.1
  port: 8080
  read_header_timeout: 5s
  idle_timeout: 60s
  max_header_bytes: 1048576
  shutdown_timeout: 30s
  request_timeout: 90s
  sse_timeout: 15m
  max_body_bytes: 2097152
  trusted_proxies: []
database:
  enabled: true
  driver: sqlite
  max_open_conns: 1
  max_idle_conns: 1
  conn_max_lifetime: 30m
  batch_size: 100
  sqlite:
    path: app.db
    foreign_keys: true
    busy_timeout: 5s
    journal_mode: DELETE
auth:
  enabled: true
  session_ttl: 8h
  login_max_attempts: 8
  login_window: 10m
logging:
  level: info
  format: json
ai:
  enabled: true
  provider: openai
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  timeout: 45s
  fallback_local: true
  max_per_minute: 10
upload:
  max_bytes: 8388608
  dir: uploads
